# Template for the private, loopback-only SearXNG instance behind this connector.
# The REAL file lives on the INTERNAL volume at ~/.config/searxng/settings.yml
# (mode 600, with a generated secret) so a launchd user-agent can read it.
# Generate a secret with:  openssl rand -hex 32
use_default_settings: true

general:
  instance_name: "trevclaw-searxng"
  debug: false
  enable_metrics: false

server:
  base_url: "http://127.0.0.1:8890/"
  port: 8890
  bind_address: "127.0.0.1"
  secret_key: "REPLACE_WITH_openssl_rand_-hex_32"
  limiter: false            # no Valkey/Redis; no bot-detection gate on local JSON calls
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json                  # <-- enables the JSON API the connector calls

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

# --- Curated biomedical / scholarly engine tuning ---------------------------------
# Partial overrides merge onto SearXNG defaults by NAME (use_default_settings: true):
# only the fields below change; engine module / shortcut / category are inherited.
# Scholarly sources are weighted UP (surface for topic:"science" queries + rank higher);
# rate-limited / CAPTCHA-prone consumer engines are disabled. Per-engine timeouts must
# stay <= outgoing.max_request_timeout (12.0). NOTE: crossref + openalex ship disabled by
# default, so they are explicitly enabled here. (pubmedcentral / openaire as named in some
# guides are NOT separate engines in current SearXNG — OpenAIRE ships as `openairepublications`
# and OpenAlex covers the open-access corpus; PubMed's `pubmed` engine is the biomedical core.)
engines:
  - name: pubmed
    weight: 3.0
    timeout: 8.0
  - name: semantic scholar
    weight: 2.5
    timeout: 6.0
  # NEW engine (not a SearXNG default): Europe PMC via json_engine. Carries PMID/PMCID/DOI +
  # abstracts + preprints; url_prefix builds a resolvable https://doi.org/<doi> per result.
  - name: europepmc
    engine: json_engine
    shortcut: epmc
    categories: [science]
    paging: false
    search_url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query={query}&format=json&resultType=core&pageSize=10
    results_query: resultList/result
    url_query: doi
    url_prefix: https://doi.org/
    title_query: title
    content_query: abstractText
    content_html_to_text: true
    weight: 2.5
    timeout: 8.0
    disabled: false
  # NEW engine (not a SearXNG default): eLife via json_engine — restored 2026-09-19 after the
  # scrape-sidecar removal (2026-09-18). eLife was that component's ONLY working connector; its
  # public API is plain HTTPS + key-free, so no browser is needed to reach it. The article HTML
  # returns 406 to a plain client (content negotiation, NOT JS-rendering) — hence the API, not
  # the page. `impactStatement` is a flat string on research articles; `abstract` is a nested
  # object json_engine cannot flatten, so it is deliberately not used here.
  - name: elife
    engine: json_engine
    shortcut: elife
    categories: [science]
    paging: false
    search_url: https://api.elifesciences.org/search?for={query}&per-page=10
    results_query: items
    url_query: doi
    url_prefix: https://doi.org/
    title_query: title
    content_query: impactStatement
    content_html_to_text: true
    weight: 2.0
    timeout: 8.0
    disabled: false
  - name: crossref
    disabled: false
    weight: 2.0
    timeout: 10.0
  - name: openalex
    disabled: false
    weight: 2.0
    timeout: 8.0
    # mailto: "you@example.com"   # optional: OpenAlex polite pool
  - name: openairepublications
    weight: 1.5
    timeout: 6.0
  - name: arxiv
    weight: 1.0
    timeout: 6.0
    disabled: true        # upstream "HTTP error" since at least 2026-09-19 — returns nothing and
                          # costs 6s per science query. Flip back to false when upstream recovers.
  - name: brave
    disabled: true
  - name: google scholar
    disabled: true

# --- General-web lane (repaired 2026-09-19) --------------------------------------
# The stock general engines both bot-detect this instance and return ZERO, which made
# topic:"general" searches silently empty while topic:"science" stayed healthy. They
# fingerprint the client precisely BECAUSE there is no browser here (no JS execution, no
# canvas, plain httpx) — a headless browser is what would defeat them, and this host has
# permanently foreclosed that. So the fix is to use engines that tolerate honest HTTP
# clients, never to look more human. Verified live: bing returns results, these two do not.
  - name: bing
    disabled: false       # verified working 2026-09-19 (10 results, no errors)
    weight: 1.0
    timeout: 6.0
  - name: duckduckgo
    disabled: true        # "CAPTCHA" 2026-09-19 — zero results, poisons the general merge
  - name: startpage
    disabled: true        # "Suspended: CAPTCHA" 2026-09-19 — same

# --- Honest general-web engines (operator's choice, 2026-11-24) ------------------
# Asked by name on 2026-11-24, both return real results to this client (control query coverage
# 0.73 seznam / 0.93 yandex), unlike Bing (decoy results for rare queries), Google and Mojeek (silent
# JavaScript and CAPTCHA walls), DuckDuckGo and Startpage (CAPTCHA), Brave (429) and Qwant (denied).
# Both are weak on niche vendor queries: the connector's relevance guard and docs_search cover that.
# Yandex is operated from Russia, so queries sent to it leave the EU/US (accepted by the operator).
  - name: seznam
    disabled: false
    timeout: 6.0
  - name: yandex
    disabled: false
    timeout: 6.0
