[project]
name = "trevor-robey-inc-scrape-sidecar"
version = "0.1.0"
description = "Manual-invocation HTTPS sidecar that uses Playwright (Firefox + Chromium, isolated per fetch) to fetch JS-rendered open-access biomedical pages and emit provenance-tagged JSON to openclaw-bridge."
requires-python = ">=3.11"
authors = [{ name = "Trevor Robey", email = "trevor@trevorobeyinc.com" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "playwright>=1.48",
  "httpx>=0.27",
  "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
