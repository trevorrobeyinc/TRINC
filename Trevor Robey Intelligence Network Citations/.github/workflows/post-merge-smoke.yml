name: Post-Merge Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: post-merge-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: post-merge-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.13.1
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run smoke checks
        run: |
          node scripts/verify-node-runtime.js
          node --test \
            tests/security/mcp-routing-boundary.test.js \
            tests/core/phase24-operator-briefing-artifacts.test.js \
            tests/security/newsletter-mcp-phase4.test.js \
            tests/security/notion-mcp-phase4.test.js \
            tests/security/mutation-control.test.js

      - name: Close prior smoke alert issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[post-merge-smoke] main smoke failure";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const match = issues.find((issue) => issue.title === title);
            if (!match) {
              core.info("No open smoke alert issue to close.");
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: match.number,
              body: `Smoke checks recovered on \`${context.sha}\`.\n\nRun: ${runUrl}`
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: match.number,
              state: "closed"
            });

      - name: Create or update smoke alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[post-merge-smoke] main smoke failure";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              "Post-merge smoke checks failed on `main`.",
              "",
              `- Commit: \`${context.sha}\``,
              `- Workflow run: ${runUrl}`,
              "",
              "This alert is advisory-only and does not block merges."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const match = issues.find((issue) => issue.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: match.number,
                body
              });
              core.info(`Updated existing issue #${match.number}.`);
              return;
            }
            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body
            });
            core.info(`Created issue #${created.data.number}.`);
