name: Obsidian Hybrid E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45

    env:
      OBSIDIAN_E2E: "1"
      OBSIDIAN_E2E_VAULT_PATH: ${{ secrets.OBSIDIAN_E2E_VAULT_PATH }}
      OBSIDIAN_E2E_CLI_BIN: ${{ secrets.OBSIDIAN_E2E_CLI_BIN }}
      OBSIDIAN_E2E_REST_URL: ${{ secrets.OBSIDIAN_E2E_REST_URL }}
      OBSIDIAN_E2E_REST_API_KEY: ${{ secrets.OBSIDIAN_E2E_REST_API_KEY }}
      OBSIDIAN_E2E_TRANSPORT: ${{ secrets.OBSIDIAN_E2E_TRANSPORT }}
      OBSIDIAN_E2E_VAULT_NAME: ${{ secrets.OBSIDIAN_E2E_VAULT_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OBSIDIAN_E2E_VAULT_PATH}" || (echo "Missing OBSIDIAN_E2E_VAULT_PATH secret" && exit 1)
          test -n "${OBSIDIAN_E2E_REST_URL}" || (echo "Missing OBSIDIAN_E2E_REST_URL secret" && exit 1)
          test -n "${OBSIDIAN_E2E_REST_API_KEY}" || (echo "Missing OBSIDIAN_E2E_REST_API_KEY secret" && exit 1)

      - name: Install root dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm --prefix mcp-server ci

      - name: Build MCP server
        run: npm --prefix mcp-server run build

      - name: Run Obsidian Hybrid E2E tests
        run: npm --prefix mcp-server exec vitest run src/tests/e2e/obsidian.e2e.spec.ts --reporter=verbose
